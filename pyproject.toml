[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "vt2pbf"
version = "0.3.0"
description = "Python library for encoding mapbox vector tiles into tile_pbf"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "DenysMoskalenko" }
]
urls = { Homepage = "https://github.com/DenysMoskalenko/vt2pbf" }
dependencies = [
    "protobuf>=3.7.0,<8",
]
requires-python = ">=3.9"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "coverage>=7,<8",
    "ruff>=0.15.4",
    "pre-commit>=2.21.0",
]

[tool.hatch.build.targets.wheel]
packages = ["vt2pbf"]

[tool.ruff]
line-length = 120
target-version = "py313"
exclude = [
    ".venv",
    "vt2pbf/mapbox",
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "T20",
    "ASYNC",
    "A",
    "B",
    "C4",
    "C90",
    "DTZ",
    "ARG",
]
pydocstyle.convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
known-local-folder = ["vt2pbf", "tests"]
split-on-trailing-comma = true
combine-as-imports = true
case-sensitive = false
detect-same-package = true
order-by-type = false
force-sort-within-sections = true
